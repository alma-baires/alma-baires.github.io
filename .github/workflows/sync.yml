name: Sincronizar disponibilidad

on:
  schedule:
    # Corre cada 1 hora (en minuto 7, para no competir con otros jobs a la hora en punto)
    - cron: "7 * * * *"
  workflow_dispatch: {}   # permite tocar "Run workflow" a mano desde GitHub, para probar

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Actualizar disponibilidad.json
        run: python3 sync_disponibilidad.py

      - name: Guardar los cambios (si hay)
        run: |
          if [ -n "$(git status --porcelain disponibilidad.json)" ]; then
            git config user.name "alma-baires-bot"
            git config user.email "actions@users.noreply.github.com"
            git add disponibilidad.json
            git commit -m "Actualizar disponibilidad (automático)"
            git push
          else
            echo "Sin cambios en disponibilidad.json"
          fi
